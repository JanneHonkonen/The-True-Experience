[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "the-true-experience"
version = "0.1.0"
description = "Evidence-first audiovisual timeline extraction"
requires-python = ">=3.10"

[project.scripts]
true-experience = "true_experience.__main__:main"

[tool.setuptools.packages.find]
include = ["true_experience*"]
