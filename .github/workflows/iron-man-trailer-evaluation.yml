name: Iron Man trailer analysis (trial)
on:
  push:
    branches:
      - feat/iron-man-trailer-evaluation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare metadata and video tools
        run: |
          mkdir -p results
          echo '{"video_id":"8ugaeA-nMTc","status":"attempted","note":"Inspect job outcome; no media is uploaded."}' > results/acquisition.json
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade 'yt-dlp[default]'
          node --version
      - name: Obtain exact trailer (temporary runner file only)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trailer"
          yt-dlp --no-playlist --no-progress --js-runtimes node \
            --match-filter 'duration <= 420' \
            --max-filesize 160M \
            -f 'bv*[height<=480]+ba/b[height<=480]/best' \
            --merge-output-format mp4 \
            -o "$RUNNER_TEMP/trailer/iron-man.%(ext)s" \
            'https://www.youtube.com/watch?v=8ugaeA-nMTc'
          video=$(find "$RUNNER_TEMP/trailer" -maxdepth 1 -type f ! -name '*.part' | head -1)
          if [[ -z "$video" ]]; then echo "Video acquisition unavailable"; exit 1; fi
          echo "VIDEO_FILE=$video" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$video"
      - name: Install local CPU inference models
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
      - name: Analyze video; publish only derived minimal review
        env:
          OMP_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          python -m true_experience "$VIDEO_FILE" \
            --transcribe --whisper-model tiny --language en \
            --caption-frames --caption-spacing 6 --max-caption-frames 36 \
            --interval 5 -o "$RUNNER_TEMP/trailer-analysis.json"
          python -m true_experience.evaluate "$RUNNER_TEMP/trailer-analysis.json" -o "$RUNNER_TEMP/structural.json"
          python -m true_experience.trailer_review "$RUNNER_TEMP/trailer-analysis.json" \
            --video-id 8ugaeA-nMTc -o results/trailer_review.json
          python - <<'PY'
          import json
          report=json.load(open('results/trailer_review.json',encoding='utf-8'))
          print("Real model inference completed")
          print("Duration:", report['structure']['duration_seconds'])
          print("Shot candidates:", report['structure']['shots_detected'])
          print("Speech segments:", report['speech']['segment_count'])
          print("Visual captions:", report['visual']['total_captions'])
          print("Largest sample gap:", report['visual']['sampling']['largest_gap_between_sample_points_seconds'])
          print("Model accuracy: not evaluated without human annotations")
          PY
          rm -f "$RUNNER_TEMP/trailer-analysis.json" "$RUNNER_TEMP/structural.json"
      - name: Upload sanitized reports (no video/audio/transcript/frames)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iron-man-trailer-evaluation
          path: results/
          if-no-files-found: ignore
      - name: Remove temporary video file
        if: always()
        run: rm -rf "$RUNNER_TEMP/trailer"
