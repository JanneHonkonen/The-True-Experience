name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install test-only image decoder
        run: python -m pip install pillow
      - name: Run tests
        run: python -m unittest discover -s tests -v

  whisper-audio-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install compatible Whisper audio decoder without model weights
        run: python -m pip install "faster-whisper>=1.1,<2" "av>=11,<19"
      - name: Decode generated WAV through the real faster-whisper/PyAV path
        env:
          TTE_REQUIRE_ASR_DECODE: '1'
        run: python -m unittest discover -s tests -p test_asr_audio_decode.py -v
