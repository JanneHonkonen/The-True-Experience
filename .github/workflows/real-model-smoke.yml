name: Real model smoke (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and speech fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
      - name: Generate a reproducible 30-second audiovisual fixture
        run: |
          espeak -w speech.wav "The blue door opens and a person enters the room."
          ffmpeg -hide_banner -nostdin -loglevel error -y \
            -f lavfi -i color=c=red:s=160x90:r=10:d=10 \
            -f lavfi -i color=c=blue:s=160x90:r=10:d=10 \
            -f lavfi -i color=c=green:s=160x90:r=10:d=10 \
            -i speech.wav \
            -filter_complex '[0:v][1:v][2:v]concat=n=3:v=1:a=0[v];[3:a]adelay=3000,apad=whole_dur=30[a]' \
            -map '[v]' -map '[a]' -t 30 -c:v mpeg4 -c:a aac fixture.mp4
      - name: Run actual pretrained inference on CPU
        env:
          OMP_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python -m true_experience fixture.mp4 --scene-threshold 0.01 --interval 5 \
            --transcribe --whisper-model tiny --language en \
            --caption-frames --max-caption-frames 3 -o analysis.json
          python -m true_experience.evaluate analysis.json -o evaluation.json
          python - <<'PY'
          import json
          report = json.load(open("analysis.json", encoding="utf-8"))
          assert len(report["speech_segments"]) > 0, "No ASR output on spoken fixture"
          assert len(report["visual_observations"]) > 0, "No vision captions"
          assert json.load(open("evaluation.json"))["structural"]["valid"]
          print("Real model smoke completed; model accuracy is NOT established")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-smoke-reports
          path: |
            analysis.json
            evaluation.json
          if-no-files-found: ignore
